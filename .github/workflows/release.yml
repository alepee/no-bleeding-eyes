name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Build app bundle
        run: scripts/build-app.sh release

      - name: Package
        run: ditto -c -k --keepParent build/NoBleedingEyes.app "build/NoBleedingEyes-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/NoBleedingEyes-${GITHUB_REF_NAME}.zip" --generate-notes
